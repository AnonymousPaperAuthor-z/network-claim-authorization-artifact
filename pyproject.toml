[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vericlaim-artifact"
version = "1.0.0"
description = "Anonymous artifact for source-aware verification of network-asset identity claims"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
models = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.45",
  "vllm>=0.8",
]

[tool.setuptools.packages.find]
include = ["probeagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
